name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
  APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

jobs:
  build:
    name: Build & Package
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build with xcodebuild
        run: |
          set -o pipefail
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c '
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              data = {}
          root = data.get("workspace") or data.get("project") or {}
          schemes = root.get("schemes") or []
          match = [s for s in schemes if s.startswith("BatchPing")]
          print(match[0] if match else "")
          ' || true)
          if [ -n "$SCHEME" ]; then
            echo "使用 xcodebuild scheme: $SCHEME"
            xcodebuild build \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=macOS" \
              -derivedDataPath "$PWD/.build/xcode" \
              CODE_SIGNING_ALLOWED=NO \
              | tee xcodebuild.log
            echo "BIN_PATH=$PWD/.build/xcode/Build/Products/Release/BatchPing" >> "$GITHUB_ENV"
          else
            echo "xcodebuild 未暴露 BatchPing scheme，回退到 swift build"
            swift build -c release
            echo "BIN_PATH=$PWD/.build/release/BatchPing" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: swift test

      - name: Import Developer ID certificate
        if: ${{ env.APPLE_CERTIFICATE_P12_BASE64 != '' }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$RUNNER_TEMP/actions" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP/actions" build.keychain
          security import "$CERTIFICATE_PATH" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP/actions" build.keychain
          rm -f "$CERTIFICATE_PATH"

      - name: Assemble .app
        run: bash scripts/bundle.sh

      - name: Notarize and staple
        if: ${{ env.APPLE_CERTIFICATE_P12_BASE64 != '' && env.APPLE_ID != '' }}
        run: |
          xcrun notarytool submit "dist/BatchPing.app" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "dist/BatchPing.app"
          xcrun stapler validate "dist/BatchPing.app"

      - name: Build .dmg
        run: bash scripts/dmg.sh

      - name: Verify bundle
        run: |
          codesign --verify --deep --verbose=2 "dist/BatchPing.app"
          hdiutil imageinfo "dist/BatchPing-1.0.0.dmg" | head -5
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatchPing-macOS
          path: |
            dist/BatchPing-1.0.0.dmg
            dist/BatchPing.app

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/BatchPing-1.0.0.dmg \
            --title "BatchPing $GITHUB_REF_NAME" \
            --generate-notes
